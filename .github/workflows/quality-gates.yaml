name: Quality Gates

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-commits:
    name: Validate Commits
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Validate PR Commits
        run: |
          node index.ts --base origin/${{ github.event.pull_request.base.ref }}

  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OSV Scan
        env:
          OSV_VERSION: 2.5.0
          OSV_SHA256: fe152e1a546af223e6c557cc3111a8bb3e5dc02fcbf7dbe95d26567c0f0041f2
        run: |
          set -euo pipefail
          curl -sSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_arm64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --lockfile=package-lock.json

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: |
          pipx install semgrep

      - name: Semgrep Scan
        run: |
          semgrep scan --config auto --error

  audit:
    name: Audit
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Audit
        run: |
          npm audit --audit-level=low

  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Lint
        run: |
          npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Typecheck
        run: |
          npm run typecheck

  build:
    name: Build & Package
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Build
        run: |
          npm run build

      - name: Package Dry Run
        run: |
          npm pack 2>&1 | tee pack-output.txt

      - name: Check Package Size
        run: |
          set -euo pipefail
          TARBALL=$(ls *.tgz)
          SIZE=$(stat --format=%s "$TARBALL")
          SIZE_KB=$((SIZE / 1024))
          echo "Package: $TARBALL"
          echo "Size: ${SIZE_KB} KB"
          echo ""
          echo "Contents:"
          tar tzf "$TARBALL"
          echo ""
          if [ "$SIZE" -gt 92160 ]; then
            echo "::error::Package size ${SIZE_KB} KB exceeds 90 KB limit"
            exit 1
          fi
          echo "✓ Package size ${SIZE_KB} KB is within 90 KB limit"

      - name: Bin Shim Smoke Test
        run: |
          set -euo pipefail
          TARBALL=$(ls *.tgz)
          SMOKE=$(mktemp -d)
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save "$GITHUB_WORKSPACE/$TARBALL" >/dev/null
          VERSION_OUTPUT=$(node_modules/.bin/commit-sentinel --version)
          echo "bin --version: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::bin shim produced no version output"
            exit 1
          fi
          set +e
          node_modules/.bin/commit-sentinel --message 'bad message' >/dev/null 2>&1
          CODE=$?
          set -e
          if [ "$CODE" -ne 2 ]; then
            echo "::error::bin shim should exit 2 on invalid message, got $CODE"
            exit 1
          fi
          echo "✓ Bin shim works"

  test-unit:
    name: Test (Unit)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Unit Tests
        run: |
          npm run test:unit:cov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage/unit.lcov

  test-integration:
    name: Test (Integration)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Integration Tests
        run: |
          npm run test:integration:cov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: coverage/integration.lcov

  test-smoke:
    name: Test (Smoke)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Smoke Tests
        run: |
          npm run test:smoke:cov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-smoke
          path: coverage/smoke.lcov

  test-fuzz:
    name: Test (Fuzz)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Fuzz Tests
        run: |
          npm run test:fuzz:cov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-fuzz
          path: coverage/fuzz.lcov

  test-e2e:
    name: Test (E2E)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: E2E Tests
        run: |
          npm run test:e2e:cov

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-e2e
          path: coverage/e2e.lcov

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-24.04-arm
    needs:
      - test-unit
      - test-integration
      - test-smoke
      - test-fuzz
      - test-e2e
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - name: Generate Report
        run: |
          npm run coverage:report -- --out coverage/report.md

      - name: Post Sticky Comment
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='<!-- commit-sentinel-coverage-report -->'
          COMMENT_ID=$( (gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" || true) | head -n 1)
          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              -F body=@coverage/report.md
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
              -F body=@coverage/report.md
          fi

  docs:
    name: Docs
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --prefer-offline

      - name: Build Docs
        run: |
          npm run docs:build
